name: Release Images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit release version, for example 0.1.0-rc13.4"
        required: true
      push_rc_tag:
        description: "Also push moving rc image tag"
        required: false
        type: boolean
        default: false
      ghcr_access_preflight_only:
        description: "Validate existing GHCR package access without publishing images or artifacts"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  BACKEND_IMAGE: ghcr.io/fedorovdo/officechat-backend
  FRONTEND_IMAGE: ghcr.io/fedorovdo/officechat-frontend
  GHCR_PREFLIGHT_TAG: 0.1.0-rc13.5-stable-hardening

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Determine release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9._-]+)?$ ]]; then
            echo "Invalid version: $version" >&2
            exit 2
          fi
          short_sha="${GITHUB_SHA::12}"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >>"$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start backend dependencies
        run: docker compose up -d --wait postgres valkey

      - name: Build development images
        run: docker compose build backend frontend

      - name: Migrate and verify test database
        run: |
          set -euo pipefail
          docker compose run --rm backend alembic upgrade head
          docker compose run --rm backend python -c '
          import subprocess

          def revisions(command):
              output = subprocess.check_output(["alembic", command], text=True)
              return [line.split()[0] for line in output.splitlines() if line.strip()]

          heads = revisions("heads")
          current = revisions("current")
          if len(heads) != 1:
              raise SystemExit(f"expected one Alembic head, found {len(heads)}")
          if current != heads:
              raise SystemExit(f"Alembic current {current!r} does not match head {heads!r}")
          print(f"Alembic current=head: {heads[0]}")
          '

      - name: Backend tests
        run: docker compose run --rm backend python -m pytest -q

      - name: Frontend tests
        run: docker compose run --rm frontend npm run test:run

      - name: Frontend build
        run: docker compose run --rm frontend npm run build

      - name: Optional Playwright smoke
        continue-on-error: true
        run: |
          set -euo pipefail
          docker compose up -d backend
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:8100/ready >/dev/null; then
              break
            fi
            if [[ "$attempt" -eq 60 ]]; then
              echo "Backend did not become ready for the optional Playwright smoke" >&2
              exit 1
            fi
            sleep 2
          done
          docker compose run --rm frontend npm run test:e2e

      - name: Compose validation
        run: |
          set -euo pipefail
          docker compose -f docker-compose.prod.yml config >/dev/null
          APP_SECRET_KEY=release-validation-secret-release-validation-secret \
          OFFICECHAT_VERSION=${{ steps.version.outputs.version }} \
          POSTGRES_PASSWORD=release-validation-postgres-password \
          DATABASE_URL=postgresql://officechat:release-validation-postgres-password@postgres:5432/officechat \
          PUBLIC_FRONTEND_URL=https://chat.example.com \
          PUBLIC_BACKEND_URL=https://chat.example.com \
          BACKEND_CORS_ORIGINS=https://chat.example.com \
          docker compose --env-file .env.production.example \
            -f deploy/docker-compose.release.yml config >/dev/null
          bash scripts/release/test-compose-stack.sh

      - name: Prepare required release locales
        run: |
          set -euo pipefail
          echo "runner uid=$(id -u)"
          echo "locale -a before:"
          locale -a
          if ! locale -a | grep -Eiq '^ru_RU\.(utf8|UTF-8)$'; then
            if ! command -v locale-gen >/dev/null 2>&1; then
              sudo -n apt-get update
              sudo -n apt-get install -y --no-install-recommends locales
            fi
            sudo -n locale-gen ru_RU.UTF-8
          fi
          echo "locale -a after:"
          locale -a
          locale -a | grep -qx 'C'
          locale -a | grep -Eiq '^C\.(utf8|UTF-8)$'
          locale -a | grep -Eiq '^ru_RU\.(utf8|UTF-8)$'

      - name: Shell syntax
        run: |
          bash -n scripts/release/*.sh
          bash -n scripts/release/officechatctl
          bash -n scripts/backup/*.sh
          bash -n scripts/backup-production.sh
          bash -n scripts/verify-backup.sh
          bash -n scripts/restore-production.sh
          bash -n scripts/test-backup-scripts.sh
          bash -n scripts/test-backup-restore-drill.sh

      - name: Release script tests
        run: bash scripts/release/test-release-scripts.sh

      - name: Backup script tests
        run: |
          bash scripts/test-backup-scripts.sh
          bash scripts/test-backup-restore-drill.sh

      - name: Caddy access/runtime log redaction
        run: bash scripts/release/test-caddy-access-log.sh

      - name: ShellCheck
        run: |
          docker run --rm \
            -v "$PWD:/mnt:ro" \
            koalaman/shellcheck:stable \
            -x \
            -P /mnt/scripts \
            -P /mnt/scripts/release \
            /mnt/scripts/backup-production.sh \
            /mnt/scripts/verify-backup.sh \
            /mnt/scripts/restore-production.sh \
            /mnt/scripts/backup/lib.sh \
            /mnt/scripts/test-backup-scripts.sh \
            /mnt/scripts/test-backup-restore-drill.sh \
            /mnt/scripts/release/collect-diagnostics.sh \
            /mnt/scripts/release/create-release-bundle.sh \
            /mnt/scripts/release/export-images.sh \
            /mnt/scripts/release/import-images.sh \
            /mnt/scripts/release/install-linux.sh \
            /mnt/scripts/release/lib.sh \
            /mnt/scripts/release/rollback-linux.sh \
            /mnt/scripts/release/test-caddy-access-log.sh \
            /mnt/scripts/release/test-compose-stack.sh \
            /mnt/scripts/release/test-release-scripts.sh \
            /mnt/scripts/release/uninstall-linux.sh \
            /mnt/scripts/release/update-linux.sh \
            /mnt/scripts/release/verify-install.sh \
            /mnt/scripts/release/officechatctl

      - name: Release bundle dry run
        env:
          OFFICECHAT_RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/release/create-release-bundle.sh --dry-run

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: GHCR package access preflight
        env:
          GHCR_PREFLIGHT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf -- "$tmp_dir"' EXIT
          check_package() {
            local package_name="$1"
            local response_file="${tmp_dir}/${package_name}.json"
            curl --fail --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GHCR_PREFLIGHT_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${package_name}" \
              >"$response_file"
            python3 - "$response_file" "$GITHUB_REPOSITORY" <<'PY_PACKAGE'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              package = json.load(handle)
          repository = package.get("repository") or {}
          if repository.get("full_name") != sys.argv[2]:
              raise SystemExit(f"GHCR package is not linked to {sys.argv[2]}")
          PY_PACKAGE
          }
          check_package officechat-backend
          check_package officechat-frontend
          docker buildx imagetools inspect "${BACKEND_IMAGE}:${GHCR_PREFLIGHT_TAG}" >/dev/null
          docker buildx imagetools inspect "${FRONTEND_IMAGE}:${GHCR_PREFLIGHT_TAG}" >/dev/null

      - name: Backend metadata
        id: meta_backend
        if: ${{ inputs.ghcr_access_preflight_only != true }}
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=sha-${{ steps.version.outputs.short_sha }}
            type=raw,value=rc,enable=${{ inputs.push_rc_tag == true || github.ref_type == 'tag' }}

      - name: Frontend metadata
        id: meta_frontend
        if: ${{ inputs.ghcr_access_preflight_only != true }}
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=sha-${{ steps.version.outputs.short_sha }}
            type=raw,value=rc,enable=${{ inputs.push_rc_tag == true || github.ref_type == 'tag' }}

      - name: Build and push backend image
        id: build_backend
        if: ${{ inputs.ghcr_access_preflight_only != true }}
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          target: runtime
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}

      - name: Build and push frontend image
        id: build_frontend
        if: ${{ inputs.ghcr_access_preflight_only != true }}
        uses: docker/build-push-action@v6
        with:
          context: ./apps/frontend
          target: runtime
          push: true
          build-args: |
            NEXT_PUBLIC_OFFICECHAT_VERSION=${{ steps.version.outputs.version }}
            NEXT_PUBLIC_OFFICECHAT_BUILD_SHA=${{ github.sha }}
            NEXT_PUBLIC_OFFICECHAT_BUILD_DATE=${{ github.event.repository.updated_at }}
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}

      - name: Image digest metadata
        if: ${{ inputs.ghcr_access_preflight_only != true }}
        run: |
          mkdir -p dist
          {
            echo "version=${{ steps.version.outputs.version }}"
            echo "backend_digest=${{ steps.build_backend.outputs.digest }}"
            echo "frontend_digest=${{ steps.build_frontend.outputs.digest }}"
            echo "backend_image=${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}"
            echo "frontend_image=${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}"
          } > dist/image-digests.txt
          sha256sum dist/image-digests.txt > dist/image-digests.txt.sha256

      - name: Create release bundle
        if: ${{ inputs.ghcr_access_preflight_only != true }}
        env:
          OFFICECHAT_RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/release/create-release-bundle.sh

      - name: Upload release artifacts
        if: ${{ inputs.ghcr_access_preflight_only != true }}
        uses: actions/upload-artifact@v4
        with:
          name: officechat-${{ steps.version.outputs.version }}-release
          path: |
            dist/*
            release/*
          include-hidden-files: true

      - name: Stop services
        if: always()
        run: docker compose down -v
